name: Compilar APK Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Instalar componentes del Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: AlertaYPreparados-Android
        run: ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-AlertaYPreparados
          path: AlertaYPreparados-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
