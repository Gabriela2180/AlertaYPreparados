name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Descomprimir Android.zip
        run: |
          unzip -o AlertaYPreparados-Android.zip -d proyecto

      - name: Buscar Gradle
        run: |
          GRADLE=$(find proyecto -name gradlew -type f | head -n 1)
          chmod +x "$GRADLE"
          echo "GRADLE=$GRADLE" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$(dirname "$GRADLE")"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-AlertaYPreparados
          path: "**/build/outputs/apk/**/*.apk"
